<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>今日待办</title>
  <link rel="stylesheet" href="/shared/styles.css?v=6">
  <link rel="stylesheet" href="/todo/index.css?v=6">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="hero">
      <h1>今日</h1>
      <div class="date" id="dateLabel"></div>
      <div class="sync" id="syncLabel"></div>
    </div>
    <nav class="toolbar">
      <a class="icon-btn" href="/goals" title="中期目标（内功 / 战功）" aria-label="中期目标">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="icon-btn" href="/learn" title="今天学了吗" aria-label="今天学了吗">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>
      </a>
      <button class="icon-btn" id="sortBtn" title="切换排序" aria-label="切换排序">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l4-4 4 4"/><path d="M8 17l4 4 4-4"/><path d="M12 3v18"/></svg>
      </button>
      <button class="icon-btn" id="aiBtn" title="AI 排优先级" aria-label="AI 排优先级">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 11-12h-7l1-8z"/></svg>
      </button>
      <button class="icon-btn" id="exportBtn" title="导出到剪贴板" aria-label="导出">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </nav>
  </header>

  <div class="stats">
    <span class="stat" data-filter="open" role="button" tabindex="0" title="只看未完成"><b id="statOpenN">0</b><span>待办</span></span>
    <span class="stat today" data-filter="today" role="button" tabindex="0" title="只看今天新增"><b id="statTodayN">0</b><span>今日</span></span>
    <span class="stat late" data-filter="late" role="button" tabindex="0" title="只看拖延的"><b id="statLateN">0</b><span>拖延</span></span>
    <span class="stat" data-filter="done" role="button" tabindex="0" title="只看已完成"><b id="statDoneN">0</b><span>完成</span></span>
  </div>
  <div class="progress"><i id="progressBar"></i></div>

  <div class="learn-card">
    <div class="learn-head">
      <span class="learn-title">💡 今天学了吗</span>
      <span class="learn-meta" id="learnMeta">连续 0 天 · 今天已记 0 条</span>
      <a class="learn-link" href="/learn">完整记录 / 复盘 →</a>
    </div>
    <div class="learn-row">
      <input type="text" id="learnInput" placeholder="今天学到了什么？一句话总结…" autocomplete="off">
      <button class="btn small" id="learnSave">记一条</button>
    </div>
  </div>

  <div class="viewtabs">
    <button class="vtab active" id="tabList" data-view="list">列表</button>
    <button class="vtab" id="tabCal" data-view="cal">日历</button>
  </div>

  <!-- 列表视图 -->
  <div id="viewList">
    <div class="input-card">
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
      <textarea id="input" rows="1" placeholder="添加任务，回车确认（粘贴多行可批量添加）…"></textarea>
    </div>
    <div class="hint">点上方统计可筛选（再点一次回到全部）· 回车添加（截止默认今天）· 点 P 标下拉选优先级 · 点标签编辑项目/截止/性质</div>

    <div class="section-label" id="openLabel">未完成</div>
    <div class="list" id="openList"></div>

    <div class="section-label" id="doneLabel" style="display:none">
      <span>已完成</span>
      <button class="btn small" id="clearDoneBtn">清除</button>
    </div>
    <div class="list" id="doneList"></div>
  </div>

  <!-- 日历视图 -->
  <div id="viewCal" style="display:none">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" title="上个月">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" id="calNext" title="下个月">›</button>
      <button class="btn small" id="calToday">今天</button>
    </div>
    <div id="calGrid"></div>
    <div class="cal-legend">
      <span><i style="background:var(--holiday)"></i>法定节假日</span>
      <span><i style="background:var(--makeup)"></i>调休上班</span>
      <span><i style="background:var(--muted)"></i>周末</span>
      <span><i style="background:var(--accent)"></i>截止总数</span>
      <span><i style="background:var(--ok)"></i>已完成</span>
      <span><i style="background:var(--danger)"></i>剩余</span>
    </div>
    <div class="cal-day-head" id="calDayHead"></div>
    <div class="list" id="calDayList"></div>
  </div>
</div>

<!-- 标签编辑弹窗 -->
<div class="modal-mask" id="editMask">
  <div class="modal">
    <h2>编辑任务</h2>
    <div class="field">
      <label>标题</label>
      <input id="editTitle" type="text" />
    </div>
    <div class="field">
      <label>项目标签</label>
      <div class="combo">
        <input id="editProject" type="text" placeholder="架构师Agent / MAF数据迁移 / 稽查虾…" />
        <button type="button" class="combo-btn" id="editProjectBtn" aria-label="选择项目">▾</button>
      </div>
    </div>
    <div class="field">
      <label>截止日期</label>
      <div class="row">
        <input id="editDue" type="date" />
      </div>
    </div>
    <div class="field">
      <label>优先级</label>
      <div class="prio-group" id="editPrio">
        <button class="pbtn p0" data-p="0">P0</button>
        <button class="pbtn p1" data-p="1">P1</button>
        <button class="pbtn p2" data-p="2">P2</button>
        <button class="pbtn p3" data-p="3">P3</button>
      </div>
    </div>
    <div class="field">
      <label>性质标签</label>
      <div class="combo">
        <input id="editNature" type="text" placeholder="探索类 / 交付类 / 学习类…" />
        <button type="button" class="combo-btn" id="editNatureBtn" aria-label="选择性质">▾</button>
      </div>
    </div>
    <div class="field">
      <label>关联中期目标</label>
      <button type="button" class="sel-btn" id="editGoalBtn">
        <span class="sb-text" id="editGoalText">（不关联）</span>
        <span class="chev">▾</span>
      </button>
    </div>
    <div class="modal-actions">
      <button class="btn" id="editCancel">取消</button>
      <button class="btn primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="settingsMask">
  <div class="modal">
    <h2>AI 排优先级设置</h2>
    <div class="field">
      <label>AI 接口地址（OpenAI 兼容）</label>
      <input id="cfgBase" placeholder="https://api.deepseek.com/v1" />
      <div class="sub">DeepSeek 填 https://api.deepseek.com/v1；OpenAI 填 https://api.openai.com/v1</div>
    </div>
    <div class="field">
      <label>API Key</label>
      <input id="cfgKey" type="password" placeholder="sk-…" />
      <div class="sub">只保存在你浏览器本地（localStorage），不会上传到任何服务器。</div>
    </div>
    <div class="field">
      <label>模型名</label>
      <input id="cfgModel" placeholder="deepseek-chat" />
    </div>
    <div class="modal-actions">
      <button class="btn" id="settingsCancel">取消</button>
      <button class="btn primary" id="settingsSave">保存</button>
    </div>
  </div>
</div>

<div class="prio-menu" id="prioMenu" hidden>
  <button class="prio-opt p0" data-p="0"><span class="dot"></span><b>P0</b><span class="plabel">紧急</span><span class="tick">✓</span></button>
  <button class="prio-opt p1" data-p="1"><span class="dot"></span><b>P1</b><span class="plabel">高</span><span class="tick">✓</span></button>
  <button class="prio-opt p2" data-p="2"><span class="dot"></span><b>P2</b><span class="plabel">中</span><span class="tick">✓</span></button>
  <button class="prio-opt p3" data-p="3"><span class="dot"></span><b>P3</b><span class="plabel">低</span><span class="tick">✓</span></button>
</div>

<div class="menu" id="projectMenu" hidden></div>
<div class="menu" id="natureMenu" hidden></div>
<div class="menu" id="goalMenu" hidden></div>

<div class="toast" id="toast"></div>

<script src="/shared/shared.js?v=6"></script>
<script type="module" src="/todo/index.js?v=6"></script>
</body>
</html>
