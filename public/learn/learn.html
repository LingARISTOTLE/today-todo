<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>今天学了吗 · 今日待办</title>
<link rel="stylesheet" href="/shared/styles.css?v=6">
<link rel="stylesheet" href="/learn/learn.css?v=6">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <a class="back" href="/">← 今日待办</a>
      <h1>今天学了吗</h1>
      <div class="sub">每天记一点，季度看得到成长</div>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="streak-card">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-col">
      <div class="streak-label">连续学习天数</div>
      <div class="streak-sub" id="streakSub">今天还没记，写一条吧</div>
    </div>
  </div>

  <div class="quick-add">
    <textarea id="quickInput" class="big" rows="3" placeholder="今天学到了什么？一句话总结也行…"></textarea>
    <button class="btn-primary" id="quickSave">记下今天</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="diary">日记</button>
    <button class="tab" data-tab="review">季度复盘</button>
  </div>

  <section id="tab-diary">
    <div class="cal-head">
      <button class="cal-nav" id="calPrev" title="上一月">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="cal-nav" id="calNext" title="下一月">›</button>
      <button class="btn small" id="calToday">今天</button>
    </div>
    <div id="calGrid"></div>
    <div class="cal-legend">
      <span><i style="background:var(--ok)"></i>已学习</span>
      <span><i style="background:var(--muted)"></i>周末</span>
    </div>

    <div class="day-head" id="dayHead">—</div>
    <div id="dayEntries"></div>
  </section>

  <section id="tab-review" hidden>
    <div class="cal-head">
      <button class="cal-nav" id="qPrev" title="上一季度">‹</button>
      <div class="cal-title" id="qTitle">—</div>
      <button class="cal-nav" id="qNext" title="下一季度">›</button>
    </div>
    <div class="review-stats" id="reviewStats"></div>
    <div class="review-box">
      <textarea id="reviewInput" class="big" rows="4" placeholder="这个季度你学到了什么？有没有浪费时间？…"></textarea>
      <button class="btn-primary" id="reviewSave">保存季度总结</button>
    </div>
    <div id="reviewList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="/shared/shared.js?v=6"></script>
<script type="module" src="/learn/learn.js?v=6"></script>
</body>
</html>
