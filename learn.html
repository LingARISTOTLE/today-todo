<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你今天学了吗 · 今日待办</title>
<link rel="stylesheet" href="styles.css">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 100px; }

  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 30px; font-weight: 780; letter-spacing: -.03em; margin: 5px 0 0; line-height: 1.05; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 7px; }
  .toolbar { display: flex; gap: 2px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .16s, color .16s; padding: 0;
  }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  html[data-theme="light"] .icon-btn .i-moon { display: none; }
  html[data-theme="dark"] .icon-btn .i-sun { display: none; }

  .streak-card {
    display: flex; align-items: center; gap: 18px; padding: 16px 20px;
    background: var(--accent-soft); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 16px;
  }
  .streak-num { font-size: 36px; font-weight: 800; color: var(--accent); line-height: 1; min-width: 56px; text-align: center; }
  .streak-col { display: flex; flex-direction: column; gap: 2px; }
  .streak-label { font-size: 13px; font-weight: 680; color: var(--text-2); }
  .streak-sub { font-size: 12px; color: var(--muted); }

  textarea.big {
    width: 100%; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--bg);
    color: var(--text); font: inherit; font-size: 14px; padding: 12px; resize: vertical; min-height: 76px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  textarea.big:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn-primary {
    border: 0; background: var(--accent); color: #fff; cursor: pointer;
    padding: 9px 18px; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 650;
    transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(.97); }
  .quick-add { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .quick-add .btn-primary { align-self: flex-end; }

  .tabs { display: flex; gap: 4px; background: var(--border); padding: 4px; border-radius: 13px; margin-bottom: 16px; }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 8px 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 650; transition: .16s;
  }
  .tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }

  /* 月历 */
  .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cal-title { flex: 1; text-align: center; font-size: 15px; font-weight: 700; }
  .calnav {
    border: 0; background: transparent; color: var(--text); width: 32px; height: 32px;
    border-radius: 9px; cursor: pointer; font-size: 18px; transition: background .15s; flex-shrink: 0;
  }
  .calnav:hover { background: var(--border); }
  .calnav.today { width: auto; padding: 0 10px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); }
  .calnav.today:hover { color: var(--text); }
  .cal-dow { text-align: center; font-size: 11px; color: var(--muted); font-weight: 600; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
  .cal-cell {
    position: relative; aspect-ratio: 1; border: 1px solid var(--border); border-radius: 10px;
    background: var(--card); cursor: pointer; font-size: 13px; color: var(--text);
    display: flex; align-items: center; justify-content: center; transition: .13s;
  }
  .cal-cell:hover { border-color: var(--border-strong); }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
  .cal-cell .learn-dot {
    position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--ok);
  }
  .cal-cell.selected .learn-dot { background: #fff; }
  .cal-cell.empty { background: transparent; border-color: transparent; cursor: default; }
  .cal-cell.empty:hover { border-color: transparent; }

  .day-head { font-size: 14px; font-weight: 700; color: var(--text-2); margin: 14px 0 10px; }
  .entry {
    border: 1px solid var(--border); border-radius: 12px; background: var(--card);
    padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm);
  }
  .entry .e-content { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .entry .e-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .entry .e-acts { display: flex; justify-content: flex-end; gap: 2px; margin-top: 8px; }
  .entry .e-acts button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 4px 8px; border-radius: 7px; transition: .14s;
  }
  .entry .e-acts button:hover { background: var(--border); color: var(--text); }
  .entry .e-acts .del:hover { color: var(--danger); }
  .entry.editing textarea {
    width: 100%; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--bg);
    color: var(--text); font: inherit; font-size: 14px; padding: 10px; min-height: 70px; resize: vertical; outline: none;
  }
  .entry.editing textarea:focus { border-color: var(--accent); }

  /* 季度复盘 */
  .review-stats { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat { flex: 1; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 8px; }
  .stat .n { font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .stat.warn .n { color: var(--danger); }
  .review-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .review-box .btn-primary { align-self: flex-end; }
  .review-group { margin-bottom: 14px; }
  .review-day { font-size: 13px; font-weight: 700; color: var(--text-2); margin: 14px 0 8px; }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 100; box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <a class="back" href="/">← 今日待办</a>
      <h1>你今天学了吗</h1>
      <div class="sub">每天记一点，季度看得到成长</div>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.9 4.9l1.4 1.4"/><path d="M17.7 17.7l1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M4.9 19.1l1.4-1.4"/><path d="M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="streak-card">
    <div class="streak-num" id="streakNum">0</div>
    <div class="streak-col">
      <div class="streak-label">连续学习天数</div>
      <div class="streak-sub" id="streakSub">今天还没记，写一条吧</div>
    </div>
  </div>

  <div class="quick-add">
    <textarea id="quickInput" class="big" rows="3" placeholder="今天学到了什么？一句话总结也行…"></textarea>
    <button class="btn-primary" id="quickSave">记下今天</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="diary">日记</button>
    <button class="tab" data-tab="review">季度复盘</button>
  </div>

  <section id="tab-diary">
    <div class="cal-head">
      <button class="calnav" id="calPrev" title="上一月">‹</button>
      <div class="cal-title" id="calTitle">—</div>
      <button class="calnav" id="calNext" title="下一月">›</button>
      <button class="calnav today" id="calToday">今天</button>
    </div>
    <div class="cal-grid" id="calDows"></div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="day-head" id="dayHead">—</div>
    <div id="dayEntries"></div>
  </section>

  <section id="tab-review" hidden>
    <div class="cal-head">
      <button class="calnav" id="qPrev" title="上一季度">‹</button>
      <div class="cal-title" id="qTitle">—</div>
      <button class="calnav" id="qNext" title="下一季度">›</button>
    </div>
    <div class="review-stats" id="reviewStats"></div>
    <div class="review-box">
      <textarea id="reviewInput" class="big" rows="4" placeholder="这个季度你学到了什么？有没有浪费时间？…"></textarea>
      <button class="btn-primary" id="reviewSave">保存季度总结</button>
    </div>
    <div id="reviewList"></div>
  </section>
</div>

<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script type="module" src="learn.js"></script>
</body>
</html>
