<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中期目标 · 今日待办</title>
<style>
  :root {
    --bg: #f6f7fb;
    --bg-glow: rgba(91, 91, 214, .07);
    --card: #ffffff;
    --text: #171922;
    --text-2: #454b5a;
    --muted: #9298a8;
    --border: #eceef4;
    --border-strong: #dfe3ed;
    --accent: #5b5bd6;
    --accent-2: #8b5cf6;
    --accent-soft: rgba(91, 91, 214, .10);
    --danger: #e5484d;
    --danger-soft: rgba(229, 72, 77, .10);
    --warn: #e8850c;
    --warn-soft: rgba(232, 133, 12, .12);
    --ok: #22a06b;
    --ok-soft: rgba(34, 160, 107, .12);
    --shadow-sm: 0 1px 2px rgba(16, 18, 27, .05);
    --shadow-md: 0 2px 6px rgba(16, 18, 27, .05), 0 20px 44px -24px rgba(16, 18, 27, .18);
  }
  html[data-theme="dark"] {
    --bg: #0b0c11;
    --bg-glow: rgba(125, 132, 246, .13);
    --card: #16171f;
    --text: #ecedf3;
    --text-2: #c3c8d5;
    --muted: #6e7486;
    --border: #262a38;
    --border-strong: #333848;
    --accent: #7d84f6;
    --accent-2: #a78bfa;
    --accent-soft: rgba(125, 132, 246, .14);
    --danger: #f26d6f;
    --danger-soft: rgba(242, 109, 111, .14);
    --warn: #f3a83d;
    --warn-soft: rgba(243, 168, 61, .14);
    --ok: #43c184;
    --ok-soft: rgba(67, 193, 132, .14);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
    --shadow-md: 0 2px 6px rgba(0, 0, 0, .4), 0 20px 44px -24px rgba(0, 0, 0, .65);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 480px at 50% -160px, var(--bg-glow), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    transition: background .25s, color .25s;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 100px; }

  /* header */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
  .back { color: var(--muted); text-decoration: none; font-size: 13px; font-weight: 600; }
  .back:hover { color: var(--accent); }
  h1 { font-size: 30px; font-weight: 780; letter-spacing: -.03em; margin: 5px 0 0; line-height: 1.05; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 7px; }
  .toolbar { display: flex; gap: 2px; }
  .icon-btn {
    border: 0; background: transparent; color: var(--muted);
    width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
    transition: background .16s, color .16s; padding: 0;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }

  /* quarter bar */
  .quarterbar {
    display: flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 12px; box-shadow: var(--shadow-sm); margin-bottom: 16px;
  }
  .qbtn {
    border: 0; background: transparent; color: var(--text);
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer; font-size: 18px;
    transition: background .15s; flex-shrink: 0;
  }
  .qbtn:hover { background: var(--border); }
  .qinfo { flex: 1; text-align: center; line-height: 1.2; }
  .q-title { font-size: 16px; font-weight: 720; letter-spacing: -.01em; }
  .q-range { font-size: 12px; color: var(--muted); }
  .qtoday { width: auto; padding: 0 10px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); }
  .qtoday:hover { color: var(--text); }
  .addbtn {
    border: 0; background: var(--accent); color: #fff; cursor: pointer;
    height: 34px; padding: 0 15px; border-radius: 9px; font-size: 13px; font-weight: 650;
    transition: filter .15s, transform .1s; flex-shrink: 0; white-space: nowrap;
  }
  .addbtn:hover { filter: brightness(1.08); }
  .addbtn:active { transform: scale(.97); }

  /* dimension tabs */
  .dimtabs { display: flex; gap: 4px; background: var(--border); padding: 4px; border-radius: 13px; margin-bottom: 14px; }
  .dimtab {
    flex: 1; border: 0; background: transparent; color: var(--muted); cursor: pointer;
    padding: 8px 0; border-radius: 10px; font: inherit; font-size: 14px; font-weight: 650;
    transition: .16s; display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .dimtab .n {
    font-size: 11px; font-weight: 700; background: var(--border-strong); color: var(--text-2);
    border-radius: 99px; padding: 1px 7px; line-height: 1.5;
  }
  .dimtab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow-sm); }
  .dimtab.active .n { background: var(--accent-soft); color: var(--accent); }

  /* progress */
  .progress { height: 6px; border-radius: 99px; background: var(--border); overflow: hidden; margin: 0 0 8px; }
  .progress > i {
    display: block; height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .5s cubic-bezier(.22, 1, .36, 1);
  }
  .prog-label { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .prog-label b { color: var(--ok); font-weight: 700; }

  /* goal list */
  .cat { margin-bottom: 22px; }
  .cat-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
  .cat-name { font-size: 13px; color: var(--muted); font-weight: 680; }
  .cat-count { font-size: 11px; color: var(--muted); opacity: .8; }

  .goal {
    border: 1px solid var(--border); border-radius: 13px; padding: 12px 14px;
    margin-bottom: 9px; background: var(--card); box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  .goal:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
  .g-top { display: flex; align-items: center; gap: 10px; }
  .g-top .title { flex: 1; font-size: 14.5px; font-weight: 640; line-height: 1.35; }
  .goal.done .g-top .title { color: var(--muted); text-decoration: line-through; }
  .status {
    border: 0; border-radius: 7px; font-size: 11px; padding: 3px 8px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0; font-weight: 680; letter-spacing: .01em;
  }
  .status.todo { color: var(--muted); background: var(--border); }
  .status.doing { color: var(--warn); background: var(--warn-soft); }
  .status.done { color: var(--ok); background: var(--ok-soft); }
  .g-acts { display: flex; gap: 2px; flex-shrink: 0; }
  .g-acts button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 4px 7px; border-radius: 7px; transition: .14s;
  }
  .g-acts button:hover { background: var(--border); color: var(--text); }
  .g-acts .del:hover { color: var(--danger); }

  .goal .link { font-size: 12px; color: var(--accent); text-decoration: none; display: inline-block; margin-top: 7px; }
  .goal .link:hover { text-decoration: underline; }

  .docs-toggle {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 4px 0; margin-top: 5px; font-family: inherit; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .docs-toggle:hover { color: var(--text); }
  .docs-toggle .chev { transition: transform .2s; display: inline-block; font-size: 10px; }
  .goal.open .docs-toggle .chev { transform: rotate(180deg); }
  .docs { display: none; flex-direction: column; gap: 2px; margin-top: 7px; padding-left: 4px; }
  .goal.open .docs { display: flex; }
  .doclink { font-size: 12px; color: var(--text-2); text-decoration: none; line-height: 1.7; }
  .doclink:hover { color: var(--accent); }
  .doclink::before { content: '· '; color: var(--muted); }

  .goal .note { font-size: 12px; color: var(--muted); margin-top: 6px; }

  /* book card（书籍阅读，C 端质感） */
  .book {
    border: 1px solid var(--border); border-radius: 16px;
    background: var(--card); box-shadow: var(--shadow-sm);
    margin-bottom: 14px; overflow: hidden;
    transition: border-color .18s, box-shadow .18s, transform .18s;
  }
  .book:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .book-head { display: flex; align-items: center; gap: 13px; padding: 14px 16px 12px; cursor: pointer; }
  .cover {
    position: relative; width: 46px; height: 62px; border-radius: 3px 8px 8px 3px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 21px; font-weight: 800; letter-spacing: -.02em;
    box-shadow: 0 8px 16px -6px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.12);
    text-shadow: 0 1px 3px rgba(0,0,0,.25); overflow: hidden;
  }
  .cover::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 6px;
    background: rgba(0,0,0,.22); border-radius: 3px 0 0 3px;
  }
  .cover::after {
    content: ''; position: absolute; top: 0; left: 6px; right: 0; height: 42%;
    background: linear-gradient(rgba(255,255,255,.24), transparent);
    border-radius: 0 7px 0 0;
  }
  .cover span { position: relative; z-index: 1; }
  .book-meta { flex: 1; min-width: 0; }
  .book-title { font-size: 15px; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; }
  .book-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .book-sub a { color: var(--accent); text-decoration: none; }
  .book-sub a:hover { text-decoration: underline; }
  .book-head .status { flex-shrink: 0; }
  .fold { color: var(--muted); font-size: 13px; flex-shrink: 0; margin-left: 2px; transition: transform .2s; }
  .book.open .fold { transform: rotate(180deg); }
  .chapters { max-height: 0; overflow: hidden; transition: max-height .38s cubic-bezier(.4, 0, .2, 1); }
  .book.open .chapters { max-height: 900px; }
  .ch-inner { border-top: 1px solid var(--border); padding: 6px 0; }
  .chapter {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px; color: var(--text-2); text-decoration: none;
    font-size: 13px; transition: background .13s, color .13s;
  }
  .chapter:hover { background: var(--border); color: var(--text); }
  .ch-title { flex: 1; line-height: 1.5; }
  .ch-link { color: var(--muted); font-size: 13px; opacity: 0; transform: translateX(-3px); transition: opacity .15s, transform .15s; }
  .chapter:hover .ch-link { opacity: 1; transform: translateX(0); }
  .book-foot {
    border-top: 1px solid var(--border); padding: 7px 12px 7px 16px;
    display: flex; justify-content: flex-end; gap: 2px;
  }
  .book-foot button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font-size: 12px; padding: 4px 8px; border-radius: 7px; transition: .14s;
  }
  .book-foot button:hover { background: var(--border); color: var(--text); }
  .book-foot .del:hover { color: var(--danger); }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 40px 0; }

  /* modal */
  .mask {
    position: fixed; inset: 0; background: rgba(5, 6, 12, .5); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .mask[hidden] { display: none; }
  .form {
    width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 12px;
    max-height: 90vh; overflow: auto;
  }
  .form h3 { margin: 0 0 4px; font-size: 17px; }
  .form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .form input, .form select, .form textarea {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: 9px;
    color: var(--text); padding: 8px 10px; font-size: 14px; font-family: inherit;
  }
  .form input:focus, .form select:focus, .form textarea:focus { outline: none; border-color: var(--accent); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .form-actions button { border-radius: 9px; cursor: pointer; font-size: 14px; padding: 8px 16px; border: 0; }
  .form-actions .ghost { background: transparent; border: 1px solid var(--border-strong); color: var(--text); }
  .form-actions .primary { background: var(--accent); color: #fff; font-weight: 650; }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div>
      <a class="back" href="/">← 今日待办</a>
      <h1>中期目标</h1>
      <div class="sub">按季度记录内功（能力）与战功（交付）</div>
    </div>
    <div class="toolbar">
      <button class="icon-btn" id="themeBtn" title="切换主题">🌓</button>
    </div>
  </header>

  <div class="quarterbar">
    <button class="qbtn" id="qPrev" title="上一季度">‹</button>
    <div class="qinfo">
      <div class="q-title" id="qTitle">—</div>
      <div class="q-range" id="qRange">—</div>
    </div>
    <button class="qbtn" id="qNext" title="下一季度">›</button>
    <button class="qbtn qtoday" id="qToday">回到本季度</button>
    <button class="addbtn" id="addBtn">＋ 添加</button>
  </div>

  <div class="dimtabs">
    <button class="dimtab active" data-dim="内功">内功 <span class="n" id="nNeigong">0</span></button>
    <button class="dimtab" data-dim="战功">战功 <span class="n" id="nZhangong">0</span></button>
  </div>

  <div class="progress"><i id="dimProgress"></i></div>
  <div class="prog-label" id="progLabel"></div>

  <main id="goals"></main>
</div>

<div class="mask" id="mask" hidden>
  <form class="form" id="form">
    <h3 id="formTitle">添加目标</h3>
    <label>维度
      <select id="fDim"><option value="内功">内功</option><option value="战功">战功</option></select>
    </label>
    <label>类别
      <input id="fCat" list="catList" placeholder="书籍阅读 / 项目交付 / …">
      <datalist id="catList"><option value="书籍阅读"></option><option value="项目交付"></option></datalist>
    </label>
    <label>标题
      <input id="fTitle" placeholder="目标 / 条目名称">
    </label>
    <label>飞书文档链接
      <input id="fLink" placeholder="https://…feishu.cn/…（读书笔记 / 方案）">
    </label>
    <label>状态
      <select id="fStatus">
        <option value="todo">未开始</option>
        <option value="doing">进行中</option>
        <option value="done">已完成</option>
      </select>
    </label>
    <label>备注
      <textarea id="fNote" rows="3" placeholder="可选"></textarea>
    </label>
    <div class="form-actions">
      <button type="button" class="ghost" id="fCancel">取消</button>
      <button type="submit" class="primary" id="fSave">保存</button>
    </div>
  </form>
</div>

<script>
(function () {
  var DIMS = ['内功', '战功'];
  var STATUS = { todo: '未开始', doing: '进行中', done: '已完成' };
  var THEME_KEY = 'today-todo-theme';
  var DIM_KEY = 'today-todo-goals-dim';
  var state = { goals: [], quarter: '', dim: '内功', editingId: null };

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ---- quarter ---- */
  function qParts(q) {
    var m = /^(\d{4})-Q([1-4])$/.exec(q);
    return m ? { y: +m[1], q: +m[2] } : null;
  }
  function currentQuarter() {
    var d = new Date();
    return d.getFullYear() + '-Q' + Math.ceil((d.getMonth() + 1) / 3);
  }
  function shiftQuarter(q, delta) {
    var p = qParts(q) || qParts(currentQuarter());
    var idx = p.y * 4 + (p.q - 1) + delta;
    return Math.floor(idx / 4) + '-Q' + (idx % 4 + 1);
  }
  function quarterRange(q) {
    var p = qParts(q);
    var start = (p.q - 1) * 3 + 1;
    return p.y + ' 年 ' + start + ' 月 - ' + (start + 2) + ' 月';
  }

  /* ---- data ---- */
  function loadGoals() {
    fetch('/api/goals', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('no'); return r.json(); })
      .then(function (d) {
        state.goals = Array.isArray(d.goals) ? d.goals : [];
        render();
      })
      .catch(function () { state.goals = []; render(); });
  }
  function saveGoals() {
    fetch('/api/goals', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ goals: state.goals })
    }).catch(function () {});
  }

  /* ---- render ---- */
  function goalsInQuarter() {
    return state.goals.filter(function (g) { return g.quarter === state.quarter; });
  }
  function dimGoals() {
    return goalsInQuarter().filter(function (g) { return g.dimension === state.dim; });
  }
  function groupByCat(items) {
    items = items.slice().sort(function (a, b) {
      var o = { todo: 0, doing: 1, done: 2 };
      return (o[a.status] || 0) - (o[b.status] || 0) || (a.createdAt < b.createdAt ? -1 : 1);
    });
    var map = {};
    items.forEach(function (g) {
      var c = g.category || '其他';
      (map[c] = map[c] || []).push(g);
    });
    return map;
  }
  function goalHtml(g) {
    var docs = Array.isArray(g.docs) ? g.docs : [];
    return '<div class="goal ' + esc(g.status || 'todo') + '" data-id="' + esc(g.id) + '">' +
      '<div class="g-top">' +
        '<button class="status ' + esc(g.status || 'todo') + '" data-act="status" title="点击切换状态">' + esc(STATUS[g.status] || g.status) + '</button>' +
        '<span class="title">' + esc(g.title) + '</span>' +
        '<div class="g-acts">' +
          '<button data-act="edit" title="编辑">编辑</button>' +
          '<button data-act="del" class="del" title="删除">删除</button>' +
        '</div>' +
      '</div>' +
      (g.link ? '<a class="link" href="' + esc(g.link) + '" target="_blank" rel="noopener">📄 打开文档 ↗</a>' : '') +
      (docs.length ? '<div><button class="docs-toggle" data-act="docs">📚 ' + docs.length + ' 篇笔记 <span class="chev">▾</span></button></div>' : '') +
      (docs.length ? '<div class="docs">' + docs.map(function (d) {
        return '<a class="doclink" href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.title) + '</a>';
      }).join('') + '</div>' : '') +
      (g.note ? '<div class="note">' + esc(g.note) + '</div>' : '') +
    '</div>';
  }
  var COVERS = [
    'linear-gradient(135deg, #5b5bd6, #8b5cf6)',
    'linear-gradient(135deg, #0e7490, #22d3ee)',
    'linear-gradient(135deg, #16a34a, #4ade80)',
    'linear-gradient(135deg, #ea580c, #fbbf24)',
    'linear-gradient(135deg, #db2777, #f472b6)',
    'linear-gradient(135deg, #7c3aed, #a78bfa)'
  ];
  function coverChar(title) {
    var t = String(title || '').replace(/^《/, '').replace(/》$/, '').trim();
    return t ? t.charAt(0) : '📖';
  }
  function stripBookPrefix(t, book) {
    var s = String(t || ''), b = String(book || '').trim();
    return (b && s.indexOf(b) === 0) ? s.slice(b.length) : s;
  }
  function bookHtml(g, idx) {
    var docs = Array.isArray(g.docs) ? g.docs : [];
    var ch = docs.map(function (d) {
      return '<a class="chapter" href="' + esc(d.url) + '" target="_blank" rel="noopener">' +
        '<span class="ch-title">' + esc(stripBookPrefix(d.title, g.title)) + '</span>' +
        '<span class="ch-link">↗</span>' +
      '</a>';
    }).join('');
    return '<div class="book goal ' + esc(g.status || 'todo') + '" data-id="' + esc(g.id) + '">' +
      '<div class="book-head" data-act="fold" title="展开 / 折叠章节">' +
        '<div class="cover" style="background:' + COVERS[idx % COVERS.length] + '"><span>' + esc(coverChar(g.title)) + '</span></div>' +
        '<div class="book-meta">' +
          '<div class="book-title">' + esc(g.title) + '</div>' +
          '<div class="book-sub">' + docs.length + ' 章读书笔记' +
            (g.link ? ' · <a href="' + esc(g.link) + '" target="_blank" rel="noopener">原文 ↗</a>' : '') +
          '</div>' +
        '</div>' +
        '<button class="status ' + esc(g.status || 'todo') + '" data-act="status" title="点击切换状态">' + esc(STATUS[g.status] || g.status) + '</button>' +
        '<span class="fold">▾</span>' +
      '</div>' +
      '<div class="chapters"><div class="ch-inner">' + ch + '</div></div>' +
      '<div class="book-foot">' +
        '<button data-act="edit">编辑</button>' +
        '<button data-act="del" class="del">删除</button>' +
      '</div>' +
    '</div>';
  }
  function render() {
    var p = qParts(state.quarter);
    $('#qTitle').textContent = p.y + ' · Q' + p.q;
    $('#qRange').textContent = quarterRange(state.quarter);

    var inQ = goalsInQuarter();
    var nN = inQ.filter(function (g) { return g.dimension === '内功'; }).length;
    var nZ = inQ.filter(function (g) { return g.dimension === '战功'; }).length;
    $('#nNeigong').textContent = nN;
    $('#nZhangong').textContent = nZ;

    Array.prototype.forEach.call(document.querySelectorAll('.dimtab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-dim') === state.dim);
    });

    var items = dimGoals();
    var done = items.filter(function (g) { return g.status === 'done'; }).length;
    $('#dimProgress').style.width = items.length ? Math.round(done / items.length * 100) + '%' : '0';
    $('#progLabel').innerHTML = state.dim + ' · <b>' + done + '</b> / ' + items.length + ' 完成';

    var map = groupByCat(items);
    var cats = Object.keys(map);
    var html = '';
    if (!cats.length) {
      html = '<div class="empty">本季度暂无「' + state.dim + '」目标<br>点右上「＋ 添加」创建一条</div>';
    } else {
      cats.forEach(function (c) {
        html += '<div class="cat"><div class="cat-head"><span class="cat-name">' + esc(c) + '</span>' +
          '<span class="cat-count">' + map[c].length + ' 条</span></div>' +
          map[c].map(function (g, i) { return g.category === '书籍阅读' ? bookHtml(g, i) : goalHtml(g); }).join('') + '</div>';
      });
    }
    $('#goals').innerHTML = html;
  }

  /* ---- actions ---- */
  function cycleStatus(id) {
    var g = state.goals.find(function (x) { return x.id === id; });
    if (!g) return;
    var order = ['todo', 'doing', 'done'];
    g.status = order[(order.indexOf(g.status) + 1) % order.length];
    saveGoals(); render();
  }
  function openForm(id) {
    state.editingId = id || null;
    $('#formTitle').textContent = id ? '编辑目标' : '添加目标';
    var g = id ? state.goals.find(function (x) { return x.id === id; }) : null;
    $('#fDim').value = g ? (g.dimension || state.dim) : state.dim;
    $('#fCat').value = g ? (g.category || '') : '';
    $('#fTitle').value = g ? (g.title || '') : '';
    $('#fLink').value = g ? (g.link || '') : '';
    $('#fStatus').value = g ? (g.status || 'todo') : 'todo';
    $('#fNote').value = g ? (g.note || '') : '';
    $('#mask').hidden = false;
    $('#fTitle').focus();
  }
  function closeForm() { $('#mask').hidden = true; state.editingId = null; }
  function submitForm(e) {
    e.preventDefault();
    var title = $('#fTitle').value.trim();
    if (!title) { $('#fTitle').focus(); return; }
    var data = {
      dimension: $('#fDim').value || '内功',
      category: $('#fCat').value.trim(),
      title: title,
      link: $('#fLink').value.trim(),
      status: $('#fStatus').value || 'todo',
      note: $('#fNote').value.trim()
    };
    if (state.editingId) {
      var g = state.goals.find(function (x) { return x.id === state.editingId; });
      if (g) Object.assign(g, data);
    } else {
      state.goals.push(Object.assign({
        id: uid(), quarter: state.quarter, createdAt: new Date().toISOString()
      }, data));
    }
    saveGoals(); render(); closeForm();
  }
  function delGoal(id) {
    state.goals = state.goals.filter(function (x) { return x.id !== id; });
    saveGoals(); render();
  }

  /* ---- theme ---- */
  function applyTheme() {
    var t = null;
    try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  }
  function toggleTheme() {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }

  /* ---- events ---- */
  function init() {
    state.quarter = currentQuarter();
    try { state.dim = localStorage.getItem(DIM_KEY) || '内功'; } catch (e) {}

    $('#qPrev').addEventListener('click', function () { state.quarter = shiftQuarter(state.quarter, -1); render(); });
    $('#qNext').addEventListener('click', function () { state.quarter = shiftQuarter(state.quarter, 1); render(); });
    $('#qToday').addEventListener('click', function () { state.quarter = currentQuarter(); render(); });
    $('#addBtn').addEventListener('click', function () { openForm(null); });
    $('#themeBtn').addEventListener('click', toggleTheme);
    $('#fCancel').addEventListener('click', closeForm);
    $('#form').addEventListener('submit', submitForm);
    $('#mask').addEventListener('click', function (e) { if (e.target === $('#mask')) closeForm(); });

    document.querySelector('.dimtabs').addEventListener('click', function (e) {
      var b = e.target.closest('.dimtab');
      if (!b) return;
      state.dim = b.getAttribute('data-dim');
      try { localStorage.setItem(DIM_KEY, state.dim); } catch (err) {}
      render();
    });

    $('#goals').addEventListener('click', function (e) {
      var card = e.target.closest('.goal');
      if (!card) return;
      var id = card.getAttribute('data-id');
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      if (act === 'status') cycleStatus(id);
      else if (act === 'docs') card.classList.toggle('open');
      else if (act === 'fold') card.classList.toggle('open');
      else if (act === 'edit') openForm(id);
      else if (act === 'del') { if (confirm('删除这条目标？')) delGoal(id); }
    });

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeForm(); });

    applyTheme();
    loadGoals();
  }
  init();
})();
</script>
</body>
</html>
